name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:ui
      - run: npm run sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-and-sql-results
          path: |
            reports/api-cucumber.html
            reports/ui-cucumber.html
            sql/results/*.txt
            sql/results/*.png
          if-no-files-found: ignore
